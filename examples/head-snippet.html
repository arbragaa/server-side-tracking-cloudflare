<!--
  Snippet para o <head> da página (ex.: index.html de um projeto Lovable/Vite).
  Troque PIXEL_ID, G-XXXXXXXXXX e o endpoint do Worker.
-->

<!-- 1. Meta Pixel — só o init. O PageView sai do tracking.js com event_id (dedup com o CAPI). -->
<script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', 'PIXEL_ID');
</script>

<!-- 2. Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>

<!-- 3. Configuração + script de rastreamento -->
<script>
  window.SST_CONFIG = {
    endpoint: 'https://seudominio.com.br/track/event', // ou https://<worker>.workers.dev/track/event
    pixelId: 'PIXEL_ID',          // opcional: ativa Advanced Matching no envio do formulário
    productName: 'Meu Produto',
    productId: 'meu-produto',
    currency: 'BRL'
  };
</script>
<script defer src="/tracking.js"></script>
